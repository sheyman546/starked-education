<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Starred Education - Comprehensive course content delivery system with multimedia support and interactive learning" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Preconnect to external domains for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet">
    
    <!-- Service Worker for PWA functionality -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
    
    <title>Starred Education - Learn Anything, Anywhere</title>
    
    <!-- Meta tags for SEO and social sharing -->
    <meta property="og:title" content="Starred Education - Learn Anything, Anywhere" />
    <meta property="og:description" content="Comprehensive course content delivery system with multimedia support and interactive learning" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%PUBLIC_URL%" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Starred Education - Learn Anything, Anywhere" />
    <meta name="twitter:description" content="Comprehensive course content delivery system with multimedia support and interactive learning" />
    <meta name="twitter:image" content="%PUBLIC_URL%/twitter-image.png" />
    
    <!-- Structured data for search engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Starred Education",
      "description": "Comprehensive course content delivery system with multimedia support and interactive learning",
      "url": "%PUBLIC_URL%",
      "logo": "%PUBLIC_URL%/logo.png",
      "sameAs": [
        "https://twitter.com/starked_education",
        "https://facebook.com/starked_education",
        "https://linkedin.com/company/starked-education"
      ]
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
    <!-- Video.js JavaScript -->
    <script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
    
    <!-- Fallback message for JavaScript disabled -->
    <div id="no-js-message" style="display: none; text-align: center; padding: 50px; font-family: Arial, sans-serif;">
      <h1>JavaScript Required</h1>
      <p>Starred Education requires JavaScript to be enabled in your browser.</p>
      <p>Please enable JavaScript and reload the page to continue.</p>
    </div>
    
    <script>
      // Show no-JS message if JavaScript is disabled
      document.getElementById('no-js-message').style.display = 'none';
    </script>
  </body>
</html>
